# Chain configurations
chains:
  - name: ethereum
    rpc_url: "https://eth-mainnet.g.alchemy.com/v2/<ENTER API KEY HERE>"
    rpc_ws_url: "wss://eth-mainnet.g.alchemy.com/v2/<ENTER API KEY HERE>"
    tycho_url: "tycho-beta.propellerheads.xyz/"
    permit2_address: "0x000000000022d473030f116ddee9f6b43ac78ba3" # Uniswap Permit2 address
    private_key: ""
    # Tycho simulation stream filter
    add_tvl_threshold: 5.0
    remove_tvl_threshold: 3.0

  - name: base
    rpc_url: "https://base-mainnet.g.alchemy.com/v2/<ENTER API KEY HERE>"
    rpc_ws_url: "wss://base-mainnet.g.alchemy.com/v2/<ENTER API KEY HERE>"
    tycho_url: "tycho-base-beta.propellerheads.xyz"
    permit2_address: "0x000000000022d473030f116ddee9f6b43ac78ba3" # Uniswap Permit2 address
    private_key: ""
    # Tycho simulation stream filter
    add_tvl_threshold: 5.0
    remove_tvl_threshold: 3.0

  - name: unichain
    rpc_url: "https://unichain-mainnet.g.alchemy.com/v2/<ENTER API KEY HERE>"
    rpc_ws_url: "wss://unichain-mainnet.g.alchemy.com/v2/<ENTER API KEY HERE>"
    tycho_url: "tycho-unichain-beta.propellerheads.xyz"
    permit2_address: "0x000000000022d473030f116ddee9f6b43ac78ba3" # Uniswap Permit2 address
    private_key: ""
    # Tycho simulation stream filter
    add_tvl_threshold: 5.0
    remove_tvl_threshold: 3.0

# tycho simulation
tycho_api_key: ""

# Database configuration
database:
  user: "backend_user"
  password: "password"
  host: "localhost"
  port: 5432
  dbname: "api_db"
  max_connections: 10
  connection_timeout_secs: 30
  idle_timeout_secs: 600

# Backend server configuration
server:
