services:
  postgres:
    image: postgres:15
    profiles:
      - db
      - kumad
      - all
    container_name: kuma-db
    environment:
      POSTGRES_DB: api_db
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_db"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kuma-network

  schema-migration:
    image: postgres:15
    profiles:
      - init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=api_user
      - PGPASSWORD=password
      - PGDATABASE=api_db
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        psql -f /migrations/001_initial.sql
      "
    restart: "no"
    networks:
      - kuma-network

  test-migrations:
    image: postgres:15
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=api_user
      - PGPASSWORD=password
      - PGDATABASE=api_db
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        for file in /migrations/*.sql; do
          echo \"Running migration: $$file\"
          psql -f \"$$file\"
        done
      "
    restart: "no"
    networks:
      - kuma-network

  kumad:
    image: kumad:latest
    profiles:
      - kumad
      - all
    container_name: kumad
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - KUMA_DATABASE_HOST=postgres
    volumes:
      - ./kuma.yaml:/app/kuma.yaml:ro
      - ./tokens.ethereum.json:/app/tokens.ethereum.json:ro
      - ./tokens.base.json:/app/tokens.base.json:ro
      - ./tokens.unichain.json:/app/tokens.unichain.json:ro
    restart: unless-stopped
    networks:
      - kuma-network

  kuma-backend:
    image: backend:latest
    profiles:
      - webapp
      - all
    container_name: kuma-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - KUMA_DATABASE__HOST=postgres
    volumes:
      - ./kuma.yaml:/app/kuma.yaml:ro
    restart: unless-stopped
    networks:
      - kuma-network

  frontend:
    image: frontend:latest
    profiles:
      - webapp
      - all
    container_name: kuma-webapp
    depends_on:
      - kuma-backend
    environment:
      - BACKEND_URL=http://kuma-api:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - kuma-network

networks:
  kuma-network:
    driver: bridge

volumes:
  postgres_data:
