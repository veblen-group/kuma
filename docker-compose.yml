services:
  cloud-sql-proxy:
    profiles:
      - all
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
    # The --address=0.0.0.0 is CRITICAL for other containers to reach it
    command: 
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--private-ip"
      - "veblen-490914:us-central1:kuma-project"
    networks:
      - kuma-network

  caddy:
    image: caddy:2-alpine
    profiles:
      - all
      - webapp
    container_name: kuma-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - kuma-network

  schema-migration:
    image: postgres:15
    profiles:
      - init
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=api_user
      - PGPASSWORD=REDACTED
      - PGDATABASE=api_db
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        psql -f /migrations/001_initial.sql
      "
    restart: "no"
    networks:
      - kuma-network

  kumad:
    image: ghcr.io/veblen-group/kumad:latest
    profiles:
      - kumad
      - all
    container_name: kumad
    environment:
      - RUST_LOG=trace
    volumes:
      - ./kuma.yaml:/app/kuma.yaml:ro
      - ./tokens.ethereum.json:/app/tokens.ethereum.json:ro
      - ./tokens.base.json:/app/tokens.base.json:ro
      - ./tokens.unichain.json:/app/tokens.unichain.json:ro
    restart: unless-stopped
    networks:
      - kuma-network

  kuma-backend:
    image: ghcr.io/veblen-group/backend:latest
    profiles:
      - kumad
      - all
    container_name: kuma-backend
    depends_on:
      postgres:
        condition: service_healthy
>>>>>>> Stashed changes
    environment:
      - RUST_LOG=info
      - KUMA_DATABASE__HOST=10.44.192.3
    volumes:
      - ./kuma.yaml:/app/kuma.yaml:ro
    restart: unless-stopped
    networks:
      - kuma-network

  frontend:
    image: ghcr.io/veblen-group/frontend:latest
    profiles:
      - webapp
      - all
    container_name: kuma-webapp
    depends_on:
      - kuma-backend
    environment:
      - BACKEND_URL=http://kuma-api:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - kuma-network

networks:
  kuma-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
