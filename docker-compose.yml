services:
  postgres:
    image: postgres:15
    profiles:
      - all
      - kumad
      - db
    container_name: kuma-db
    environment:
      POSTGRES_DB: api_db
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U api_user -d api_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kuma-network

  schema-migration:
    image: postgres:15
    profiles:
      - init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=api_user
      - PGPASSWORD=password
      - PGDATABASE=api_db
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        psql -f /migrations/001_initial.sql
      "
    restart: "no"
    networks:
      - kuma-network

  kumad:
    image: ghcr.io/veblen-group/kumad:latest
    profiles:
      - all
      - kumad
    container_name: kumad
    environment:
      # Use info to avoid logging sensitive config values (keys, URLs). Override locally if needed.
      - RUST_LOG=info
    volumes:
      - ./kuma.yaml:/app/kuma.yaml:ro
      - ./tokens.ethereum.json:/app/tokens.ethereum.json:ro
      - ./tokens.base.json:/app/tokens.base.json:ro
      - ./tokens.unichain.json:/app/tokens.unichain.json:ro
    restart: unless-stopped
    networks:
      - kuma-network

  kuma-backend:
    image: ghcr.io/veblen-group/backend:latest
    profiles:
      - all
      - frontend
      - kumad
    container_name: kuma-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - KUMA_DATABASE__HOST=postgres
    volumes:
      - ./kuma.yaml:/app/kuma.yaml:ro
    restart: unless-stopped
    networks:
      - kuma-network

  frontend:
    image: ghcr.io/veblen-group/frontend:latest
    profiles:
      - all
      - frontend
    container_name: kuma-webapp
    depends_on:
      - kuma-backend
    environment:
      - BACKEND_URL=http://kuma-backend:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - kuma-network

  caddy:
    image: caddy:2-alpine
    profiles:
      - all
      - frontend
    container_name: kuma-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - kuma-network

networks:
  kuma-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
