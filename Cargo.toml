[workspace]
members = ["crates/cli", "crates/core", "crates/kumad", "crates/backend"]
resolver = "3"

[workspace.dependencies]
alloy = "1.0.12"
alloy-chains = { version = "0.2.5", features = ["serde"] }
alloy-primitives = "^1.0.0"
axum = "0.7"
binance = "0.21.0"
color-eyre = "0.6.3"
figment = { version = "0.10.19", features = ["yaml", "env"] }
futures = "0.3.31"
humantime = "2.1.0"
http = "1.3.1"
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
pin-project = "1.1.10"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
sqlx = "0.8"
taplo = "0.13.2"
tokio = { version = "1.43.0", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
tokio-stream = "0.1.17"
tokio-util = "0.7.13"
tokio-tungstenite = "0.27.0"
tower-http = "0.6"
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "once_cell",
    "tracing",
] }
tycho-execution = "0.165.1"
tycho-simulation = { version = "0.250.0", features = ["evm"] }
tycho-common = "0.152.1"
uniswap-sdk-core = "5.1.0"
uniswap-v3-sdk = { version = "5.0.0", features = ["extensions"] }
