# Production Docker Compose for GCP deployment.
#
# Prerequisites:
#   - Docker images published to ghcr.io/veblen-group/
#   - Cloud SQL instance created with database and user
#   - VM service account has roles/cloudsql.client
#   - Caddyfile updated with your real domain
#   - kuma.prod.yaml with production secrets on the VM
#   - .env file with CLOUD_SQL_CONNECTION_NAME and PGPASSWORD (see docs/DEPLOYMENT.md)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --profile frontend up -d   # caddy + frontend + backend
#   docker compose -f docker-compose.prod.yml --profile kumad up -d    # + kumad
#   docker compose -f docker-compose.prod.yml --profile init up schema-migration  # run migrations

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
    profiles:
      - all
      - frontend
      - kumad
    container_name: kuma-cloud-sql-proxy
    command:
      # --address=0.0.0.0 is required for other containers to reach the proxy
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--private-ip"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    restart: unless-stopped
    networks:
      - kuma-network

  schema-migration:
    image: postgres:15
    profiles:
      - init
    depends_on:
      cloud-sql-proxy:
        condition: service_started
    environment:
      - PGHOST=cloud-sql-proxy
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=api_db
    volumes:
      - ./migrations:/migrations
    command: >
      sh -c "
        psql -f /migrations/001_initial.sql
      "
    restart: "no"
    networks:
      - kuma-network

  kumad:
    image: ghcr.io/veblen-group/kumad:latest
    profiles:
      - kumad
      - all
    container_name: kumad
    environment:
      - RUST_LOG=info
    volumes:
      - ./kuma.prod.yaml:/app/kuma.yaml:ro
      - ./tokens.ethereum.json:/app/tokens.ethereum.json:ro
      - ./tokens.base.json:/app/tokens.base.json:ro
      - ./tokens.unichain.json:/app/tokens.unichain.json:ro
    restart: unless-stopped
    networks:
      - kuma-network

  kuma-backend:
    image: ghcr.io/veblen-group/backend:latest
    profiles:
      - frontend
      - kumad
      - all
    container_name: kuma-backend
    depends_on:
      cloud-sql-proxy:
        condition: service_started
    environment:
      - RUST_LOG=info
      - KUMA_DATABASE__HOST=cloud-sql-proxy
    volumes:
      - ./kuma.prod.yaml:/app/kuma.yaml:ro
    restart: unless-stopped
    networks:
      - kuma-network

  frontend:
    image: ghcr.io/veblen-group/frontend:latest
    profiles:
      - frontend
      - all
    container_name: kuma-webapp
    depends_on:
      - kuma-backend
    environment:
      - BACKEND_URL=http://kuma-backend:8080
      - NEXT_PUBLIC_API_URL=/api
    restart: unless-stopped
    networks:
      - kuma-network

  kuma-docs:
    image: ghcr.io/veblen-group/docs:latest
    profiles:
      - frontend
      - all
    container_name: kuma-docs
    restart: unless-stopped
    networks:
      - kuma-network

  caddy:
    image: caddy:2-alpine
    profiles:
      - all
      - frontend
    container_name: kuma-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - kuma-network

networks:
  kuma-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
